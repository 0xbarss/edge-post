name: edge-post

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edge}
      POSTGRES_DB: ${POSTGRES_DB:-edge_post}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-edge}:${POSTGRES_PASSWORD:-edge}@db:5432/${POSTGRES_DB:-edge_post}
      TCP_HOST: 0.0.0.0
      TCP_PORT: 9000
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 3000
      BOARDS_FILE: /app/firmware/boards/boards.json
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HTTP_PUBLISH_PORT:-3000}:3000"
      - "${TCP_PUBLISH_PORT:-9000}:9000"
    volumes:
      - ./firmware/boards:/app/firmware/boards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/devices >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
