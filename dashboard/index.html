<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Edge Post operator console for live sensor telemetry, presence, and command delivery."
    />
    <meta name="theme-color" content="#f8fafc" />
    <title>Edge Post | Operator Console</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230f172a'/%3E%3Cpath%20d='M5%2012a11%2011%200%200%201%2022%200'%20fill='none'%20stroke='%2338bdf8'%20stroke-width='2.2'%20stroke-linecap='round'/%3E%3Cpath%20d='M9%2012a7%207%200%200%201%2014%200'%20fill='none'%20stroke='%2338bdf8'%20stroke-width='2.2'%20stroke-linecap='round'/%3E%3Ccircle%20cx='16'%20cy='12'%20r='2.2'%20fill='%2338bdf8'/%3E%3Cpath%20d='M16%2014.5v13.5M13%2021h6M11%2028h10'%20fill='none'%20stroke='%23e2e8f0'%20stroke-width='2'%20stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem('edge-post-theme');
          const theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#090d16' : '#f8fafc');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
