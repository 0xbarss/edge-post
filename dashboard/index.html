<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Edge Post operator console for live sensor telemetry, presence, and command delivery."
    />
    <meta name="theme-color" content="#eceff2" />
    <title>Edge Post | Operator Console</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='4'%20fill='%230d1117'/%3E%3Cpath%20d='M5%2020h6l3-9%204%2014%203-7h6'%20fill='none'%20stroke='%231f44ff'%20stroke-width='2.2'%20stroke-linecap='square'%20stroke-linejoin='miter'/%3E%3C/svg%3E"
    />
    <script>
      (() => {
        try {
          const stored = window.localStorage.getItem('edge-post-theme');
          const theme = stored === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#0c0f13' : '#eceff2');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
